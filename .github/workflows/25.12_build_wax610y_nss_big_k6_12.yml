name: OpenWrt-25.12 Netgear WAX610Y NSS K6.12 in GH Release
on:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/25.12-nss'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: 25.12-nss
          fetch-depth: 0       # Fetch full history
          # fetch-depth: 100   # Adjust depth based on how far back the bump commit is
          # fetch-depth: 1     # default shallow clone     

      - name: Replace CONFIG_TCP_MD5SIG line
        run: |
          FILE="target/linux/generic/config-6.12"
          if grep -q "^# CONFIG_TCP_MD5SIG is not set" "$FILE"; then
            sed -i 's/^# CONFIG_TCP_MD5SIG is not set/CONFIG_TCP_MD5SIG=y/' "$FILE"
          fi
          echo "Check if CONFIG_TCP_MD5SIG is enabled"
          cat ./target/linux/generic/config-6.12 | grep CONFIG_TCP_MD5SIG

      - name: Commit CONFIG_TCP_MD5SIG change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ./target/linux/generic/config-6.12
          git commit -m "Enable CONFIG_TCP_MD5SIG in config-6.12" || echo "No changes to commit"

      - name: Git rebase to upstream/openwrt-25.12
        run: |
          git remote add upstream-openwrt https://git.openwrt.org/openwrt/openwrt.git
          git fetch upstream-openwrt
          git rebase upstream-openwrt/openwrt-25.12
          git rebase --rebase-merges upstream-openwrt/openwrt-25.12
          
      - name: Search for kernel bump commits
        run: |  
          echo "Show the latest kernel version bumps"
          git log --oneline | grep -i "bump 6.6 to" | head -1
          git log --oneline | grep -i "bump 6.12 to" | head -1

      - name: Extract kernel version
        run: |
          VERSION=$(git log --oneline | grep -i "bump 6.12 to" | head -1 | awk '{print $NF}')
          echo "KERNEL_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Show the content of feeds.conf.default
        run: |  
          echo "Show the content of feeds.conf.default"
          cat ./feeds.conf.default

      - name: Set executable permission
        run: |
          echo "Set executable permission"
          chmod 500 ./files/usr/bin/wsvpn-linux-arm64
          ls -la ./files/usr/bin/wsvpn-linux-arm64
          
      - name: Show available disk space before cleanup
        run: |
          echo "Available disk space before cleanup:"
          df -h

      - name: Free up disk space
        run: |
          echo "Removing unnecessary apt packages and cache..."
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "Removing Android SDK..."
          sudo rm -rf /usr/local/lib/android

          echo "Removing .NET Core..."
          sudo rm -rf /usr/share/dotnet

          echo "Removing PowerShell..."
          sudo rm -rf /opt/microsoft/powershell

          echo "Removing CodeQL Analysis..."
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "Removing Docker images..."
          docker image prune -a -f

          echo "Removing unused snap packages..."
          sudo rm -rf /var/lib/snapd/cache/*

          echo "Removing unused Homebrew packages..."
          sudo rm -rf /home/linuxbrew/.linuxbrew/

          echo "Removing unused build tools..."
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/kotlin
          sudo rm -rf /usr/share/rust

          echo "Removing TeamCity and Azul Systems content..."
          sudo rm -rf /opt/az
          sudo rm -rf /opt/hostedtoolcache/Java_Adopt_jdk
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk

          echo "Removing large cached content..."
          sudo rm -rf /var/cache/apt
          sudo rm -rf /var/lib/gems
          sudo rm -rf /var/lib/docker/tmp/*
          sudo rm -rf /usr/local/lib/python*/dist-packages
          sudo rm -rf /usr/local/lib/python*/site-packages
          sudo rm -rf /opt/hostedtoolcache/*/*

      - name: Show available disk space after cleanup
        run: |
          echo "Available disk space after cleanup:"
          df -h

      - name: Show kernel, gcc version, CPU core count, total memory
        run: |
          echo "Show kernel version:"
          uname -a
          echo "Show gcc version:"
          gcc --version
          echo "Show CPU core count:"
          nproc
          echo "Show CPU model"
          cat /proc/cpuinfo | grep "model name" | head -1
          echo "Show Total memory:"
          free -h
          
      - name: Set up build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
      - name: Prepare config file
        run: |
          cp ./.github/workflows/diffconfig.wax610y.all.nss .config
          make defconfig

      - name: Download package sources
        run: |
          make download

      - name: Build tools
        run: |
          make tools/install -j$(nproc) || make tools/install
            
      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) || make -j1 V=sc toolchain/install

      - name: Download package sources again (to fix nss-firmware download failure)
        run: |
          make download

      - name: Build OpenWrt NSS Image
        run: |
          make -j$(nproc) || make -j1 V=sc

      - name: Get SHORT SHA 
        run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV

      - name: Get the current date
        run: echo "NOW=$(date +%F-%H%M)" >> $GITHUB_ENV

      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          name: "OpenWrt-25.12 Linksys WAX610y NSS ath11k WLAN.HK.2.12-01368 ${{ env.KERNEL_VERSION }} Image ${{ env.NOW }}"
          tag: "linksys-wax610y-nss-${{ env.SHORT_SHA }}-${{ env.NOW }}"
          generateReleaseNotes: true
          makeLatest: false
          artifacts: |
            bin/targets/qualcommax/ipq60xx/*
          token: "${{ secrets.GITHUB_TOKEN }}"
